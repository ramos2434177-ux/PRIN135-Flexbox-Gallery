<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flexbox Photo Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>CSS FLEXBOX PHOTO GALLERY</h1>
    <p>A little warmth, a little kindness, and a lot of hugs.</p>
  </header>

  <main>
    <section class="gallery">

      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfZ4wj0nOMJmO3VlnR52yC4N2oGO6jE6oYbOxeygrvEw&s=10"
        alt="Two people sharing a warm and comforting embrace">

      <img
        src="https://www.dognerdly.com/wp-content/uploads/2024/04/Do-Dogs-Like-Hugs-and-Kisses.jpg"
        alt="A person showing love and affection to a dog">

      <img
        src="https://img2.chinadaily.com.cn/images/201804/22/5adc1f3aa3105cdce0a3e460.jpeg"
        alt="Two cats cuddling closely together">

      <img
        src="https://images.pexels.com/photos/4617316/pexels-photo-4617316.jpeg"
        alt="Family members gathered together in a loving hug">

      <img
        src="https://i2-prod.walesonline.co.uk/article13589517.ece/ALTERNATES/s1200b/RJS_ECH_020917_hugs_005JPG.jpg"
        alt="Two people hugging while sharing happy smiles">

      <img
        src="https://images.pexels.com/photos/4834149/pexels-photo-4834149.jpeg"
        alt="Four girls embracing each other in a group hug">

      <img
        src="https://images.pexels.com/photos/9789295/pexels-photo-9789295.jpeg"
        alt="Two girls sharing a warm and friendly embrace">

      <img
        src="https://swiftkickhq.com/wp-content/uploads/2016/10/group-hug.jpg"
        alt="A group of friends coming together for a hug">

      <img
        src="https://images.stockcake.com/public/c/4/4/c44de3e1-b241-44c2-8bd4-128bec86470b_large/joyful-group-hug-stockcake.jpg"
        alt="Friends celebrating together with a joyful group hug">

    </section>
  </main>

  <footer class="footer">
    <p>© 2026 PRIN135-Activity-09 | <a href="https://github.com/ramos2434177-ux">@dartjhacobramos</a></p>
  </footer>

</body>
</html>
